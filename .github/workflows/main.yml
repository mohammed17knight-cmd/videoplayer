name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.2 }
      - name: Create project
        run: |
          mkdir -p P/app/src/main/java/com/example/vplayer P/app/src/main/res/layout
          cd P
          cat > settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VideoPlayer44"
          include ':app'
          E
          cat > build.gradle <<'E'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          E
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.vplayer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.vplayer"
                  minSdk 19
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-ui:1.3.1'
          }
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:name="androidx.multidex.MultiDexApplication"
                  android:label="Video Player" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:scheme="content"/><data android:scheme="file"/>
                          <data android:scheme="http"/><data android:scheme="https"/>
                          <data android:mimeType="video/*"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          E
          cat > app/src/main/res/layout/activity_main.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">
              <androidx.media3.ui.PlayerView android:id="@+id/player"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  app:resize_mode="fit" app:show_buffering="when_playing"/>
              <Button android:id="@+id/open" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_gravity="top|start" android:layout_margin="12dp" android:text="Open video"/>
          </FrameLayout>
          E
          cat > app/src/main/java/com/example/vplayer/MainActivity.java <<'E'
          package com.example.vplayer;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends AppCompatActivity {
              private static final int PICK = 1;
              private PlayerView playerView;
              private View openBtn;
              private ExoPlayer player;
              private Uri uri;
              private long pos = 0;
              private boolean playWhenReady = true;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  playerView = findViewById(R.id.player);
                  openBtn = findViewById(R.id.open);
                  openBtn.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("video/*");
                      startActivityForResult(i, PICK);
                  });
                  playerView.setControllerVisibilityListener(
                      (PlayerView.ControllerVisibilityListener) v -> openBtn.setVisibility(v == View.VISIBLE ? View.VISIBLE : View.GONE));
                  if (b != null) { uri = (Uri) b.getParcelable("uri"); pos = b.getLong("pos"); }
                  else if (getIntent().getData() != null) uri = getIntent().getData();
              }

              @Override protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  if (i.getData() != null) { uri = i.getData(); pos = 0; release(); init(); }
              }

              @Override protected void onActivityResult(int req, int res, Intent d) {
                  super.onActivityResult(req, res, d);
                  if (req == PICK && res == RESULT_OK && d != null && d.getData() != null) {
                      uri = d.getData(); pos = 0; release(); init();
                  }
              }

              private void init() {
                  if (player != null || uri == null) return;
                  DefaultRenderersFactory rf = new DefaultRenderersFactory(this).setEnableDecoderFallback(true);
                  player = new ExoPlayer.Builder(this, rf).build();
                  playerView.setPlayer(player);
                  player.setMediaItem(MediaItem.fromUri(uri));
                  player.seekTo(pos);
                  player.setPlayWhenReady(playWhenReady);
                  player.prepare();
              }

              private void release() {
                  if (player == null) return;
                  pos = player.getCurrentPosition();
                  playWhenReady = player.getPlayWhenReady();
                  player.release();
                  player = null;
              }

              @Override protected void onStart() { super.onStart(); init(); }
              @Override protected void onStop() { super.onStop(); release(); }

              @Override protected void onSaveInstanceState(Bundle o) {
                  super.onSaveInstanceState(o);
                  if (player != null) pos = player.getCurrentPosition();
                  o.putParcelable("uri", uri); o.putLong("pos", pos);
              }

              @Override public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
          E
      - name: Build
        working-directory: P
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: P/app/build/outputs/apk/debug/*.apk
